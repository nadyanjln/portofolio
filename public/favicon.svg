<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161D"/>
      <stop offset="100%" stop-color="#090A0C"/>
    </linearGradient>

    <!-- Duo Gradient (Crimson to Emerald Fusion) -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="50%" stop-color="#9E0402"/>
      <stop offset="100%" stop-color="#6B0200"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Left Blade (Nadya - Crimson Coral) -->
  <path d="M16 44V20C16 17.5 18 16 20.5 17.5L34 26C36.5 27.5 36.5 30.5 34 32L22 41C19.5 42.8 16 46.5 16 44Z" fill="url(#crimsonGrad)"/>

  <!-- Right Blade (Raqwan - Emerald Cyan) -->
  <path d="M48 20V44C48 46.5 46 48 43.5 46.5L30 38C27.5 36.5 27.5 33.5 30 32L42 23C44.5 21.2 48 17.5 48 20Z" fill="url(#emeraldGrad)"/>

  <!-- Central Fusion Spark Core -->
  <polygon points="32,18 35.5,28.5 46,32 35.5,35.5 32,46 28.5,35.5 18,32 28.5,28.5" fill="url(#sparkGrad)" filter="url(#glow)"/>
</svg>
